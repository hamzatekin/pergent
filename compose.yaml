# Deployed on the Hetzner box by deploy.sh from hamzatekin/box: every push to main is built, health
# checked and started, and Traefik there does HTTPS. The variables below come from .env next to this
# file on the box (git-ignored).
services:
  app:
    build: .
    image: pergent:${TAG:-dev}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      TZ: ${TZ:-Europe/London}
      # From `claude setup-token` on a machine that is logged in to your Claude subscription.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # The password for the dashboard at /admin (costs, logs, run button). Unset, /admin is off.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # TypeSafe API key (console.typesafe.ai/keys). Set, Jev scores every story for the reader, filters news and runs the ideas radar.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      # An Aletheia capture key. Set, a logged-in reader gets "Save to notes" on every story.
      ALETHEIA_CAPTURE_KEY: ${ALETHEIA_CAPTURE_KEY:-}
      # An ntfy topic (subscribe to it in the ntfy app). Set, tasks with "notify" push their biggest stories.
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      # The site's public address, so a notification opens the paper. Optional.
      PUBLIC_URL: ${PUBLIC_URL:-}
      # Free keys from developer.adzuna.com and reed.co.uk/developers. Set, the job tracker also reads Adzuna and Reed.
      ADZUNA_APP_ID: ${ADZUNA_APP_ID:-}
      ADZUNA_APP_KEY: ${ADZUNA_APP_KEY:-}
      REED_API_KEY: ${REED_API_KEY:-}
    volumes:
      - runs:/app/runs
      - claude-home:/root/.claude
    expose:
      - "4321"
    # A ceiling for the whole container, so a run that goes wrong cannot take the server down with it:
    # the server runs at most 2 tasks at once (MAX_RUNS in src/scheduler.ts), each a claude process. Runs
    # have their own wall-clock limits on top (timeoutMinutes, 5 minutes for a before command).
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    # Traefik only routes to healthy containers, and deploy.sh waits for healthy (and goes back to the
    # previous version if it never gets there). start_interval checks every 2 s while the container
    # starts, so a deploy is down for the start time, not a full interval. The image has node but no
    # curl, and 127.0.0.1 avoids the IPv6-localhost trap.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.services.pergent.loadbalancer.server.port=4321
      - traefik.http.routers.pergent.rule=Host(`pergent.hamzatekin.dev`)
      - traefik.http.routers.pergent.entrypoints=https
      - traefik.http.routers.pergent.tls.certresolver=letsencrypt
      - traefik.http.routers.pergent.middlewares=compress@file
      - traefik.http.routers.pergent.service=pergent
      # www answers a permanent redirect to the bare host, keeping the path. $$ is a literal $ here.
      - traefik.http.routers.pergent-www.rule=Host(`www.pergent.hamzatekin.dev`)
      - traefik.http.routers.pergent-www.entrypoints=https
      - traefik.http.routers.pergent-www.tls.certresolver=letsencrypt
      - traefik.http.routers.pergent-www.middlewares=pergent-www
      - traefik.http.routers.pergent-www.service=pergent
      - traefik.http.middlewares.pergent-www.redirectregex.regex=^https://www\.pergent\.hamzatekin\.dev(?::\d+)?/(.*)
      - traefik.http.middlewares.pergent-www.redirectregex.replacement=https://pergent.hamzatekin.dev/$${1}
      - traefik.http.middlewares.pergent-www.redirectregex.permanent=true
      # pier's app-health check (hamzatekin/box ops/app-health.sh): this must answer 2xx, every minute.
      - pier.health.url=https://pergent.hamzatekin.dev/healthz

networks:
  proxy:
    external: true

volumes:
  runs:
  claude-home:
