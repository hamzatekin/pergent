# Coolify deploys this as a Docker Compose app: set the domain on the "app" service (port 4321) and fill
# the variables below in Coolify's Environment Variables tab. Coolify's own proxy does HTTPS.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      TZ: ${TZ:-Europe/London}
      # From `claude setup-token` on a machine that is logged in to your Claude subscription.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}
      # The password for the dashboard at /admin (costs, logs, run button). Unset, /admin is off.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # TypeSafe API key (console.typesafe.ai/keys). Set, every story gets a 0-10 rating from Jev.
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
    volumes:
      - runs:/app/runs
      - claude-home:/root/.claude
    expose:
      - "4321"
    # A ceiling for the whole container, so a run that goes wrong cannot take the server down with it:
    # both tasks fire at 07:30 and each is a claude process plus the server. Runs have their own
    # wall-clock limits on top (timeoutMinutes, 5 minutes for a before command).
    cpus: 2
    mem_limit: 2g
    pids_limit: 512
    # Coolify reads this block (its Healthcheck page is ignored for compose apps) and Traefik only routes
    # to healthy containers. The image has node but no curl, and 127.0.0.1 avoids the IPv6-localhost trap.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  runs:
  claude-home:
